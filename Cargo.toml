[package]
name = "cmessless"
version = "2.0.0"
authors = ["Rodney Johnson <ask@rodneylab.com>"]
edition = "2021"
homepage = "https://rodneylab.com"
license = "BSD-3-Clause"
repository = "https://github.com/rodneylab/cmessless"
# notify 8.0.0 raises msrv to 1.77
rust-version = "1.77"
description = "A markdown parser to output Astro markup."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
deunicode = "1.6.2"
markup_fmt = "0.27.5"
miette = "7.6.0"
nom = { version = "8.0.0", features = ["alloc"] }
notify = "8.2.0"
notify-debouncer-mini = { version = "0.7.0", default-features = false }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = "debuginfo"

[lints.clippy]
allow_attributes = "deny"
dbg_macro = "deny"
# print_stdout = "deny"
clone_on_ref_ptr = "deny"
empty_drop = "deny"
exit = "deny"
filetype_is_file = "deny"
get_unwrap = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
rest_pat_in_fully_bound_structs = "deny"
unnecessary_safety_comment = "deny"
debug_assert_with_mut_call = "warn"
iter_on_single_items = "warn"
needless_pass_by_ref_mut = "warn"
redundant_clone = "warn"
redundant_pub_crate = "warn"
significant_drop_in_scrutinee = "warn"
unused_peekable = "warn"
